# Всё приложение одной командой:
#   cp .env.example .env      # необязательно: без .env работают значения по умолчанию
#   docker compose up --build
#   открыть http://localhost:8080  (интерфейс; /api, /docs, /health проксируются в backend)
#
# Образы фиксированы под linux/amd64 (требование организаторов): одинаковая сборка на любой машине;
# на Apple Silicon Docker Desktop/OrbStack запускает их через эмуляцию (Rosetta).
#
# Наружу публикуется только 8080. Backend (FastAPI, порт 8000) доступен лишь внутри сети compose.
# Настройки — в .env (см. .env.example); общие параметры модели — в config/models.yaml.
#
# Модель для разбора запросов — переменная LLM_PROVIDER в .env:
#   cloud — облачная модель через OpenAI-совместимое API (ключ в LLM_API_KEY);
#   local — gemma3:12b через Ollama. С COMPOSE_PROFILES=local-llm Ollama поднимается здесь же
#           и сама скачивает модель (~8 ГБ); либо укажите свою Ollama в DOCKER_OLLAMA_URL;
#   off / пусто без ключа — только правила, модель не нужна.

services:
  backend:
    platform: linux/amd64
    build: .
    image: ostrovok-adler-backend:local
    init: true
    restart: unless-stopped
    # Миграции и идемпотентное наполнение демо-данными выполняются при каждом старте.
    entrypoint: ["sh", "/app/docker/backend-entrypoint.sh"]
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - path: .env
        required: false
    # Явные значения сильнее env_file: адреса внутри контейнера не берутся из настроек для хоста.
    environment:
      DATABASE_URL: sqlite:////app/runtime/adler.db
      PARSER_MODE: ${PARSER_MODE:-}
      REPLY_PARSER_MODE: ${REPLY_PARSER_MODE:-}
      DEMO_MODE: ${DEMO_MODE:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-}
      # По умолчанию — сервис ollama ниже (профиль local-llm); своя Ollama на хосте —
      # DOCKER_OLLAMA_URL=http://host.docker.internal:11434.
      OLLAMA_URL: ${DOCKER_OLLAMA_URL:-http://ollama:11434}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      CLOUD_LLM_BASE_URL: ${CLOUD_LLM_BASE_URL:-}
      CLOUD_LLM_MODEL: ${CLOUD_LLM_MODEL:-}
      HYBRID_LLM: ${HYBRID_LLM:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - adler-data:/app/runtime
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)); assert r['status'] == 'ok'"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  web:
    platform: linux/amd64
    build:
      context: ./web
      args:
        VITE_DATA_MODE: api
    image: ostrovok-adler-web:local
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # /health проксируется в backend: web здоров, только когда отвечает всё приложение.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Локальная модель. Запускается только с профилем: COMPOSE_PROFILES=local-llm в .env
  # (или docker compose --profile local-llm up). Модель скачивается при первом старте в том
  # ollama-models и дальше берётся оттуда. Backend её не ждёт: пока модель не готова,
  # запросы разбираются правилами.
  ollama:
    platform: linux/amd64
    image: ollama/ollama:0.40.13
    profiles: ["local-llm"]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        ollama serve & pid=$$!;
        until ollama list >/dev/null 2>&1; do sleep 1; done;
        echo "Скачиваю модель $${LOCAL_LLM_MODEL}…";
        ollama pull "$${LOCAL_LLM_MODEL}" && touch /tmp/model-ready && echo "Модель $${LOCAL_LLM_MODEL} готова";
        wait $$pid
    environment:
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-gemma3:12b}
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/model-ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 1800s

volumes:
  adler-data:
  ollama-models:
