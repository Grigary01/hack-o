# Дополнение к docker-compose.yml: React-фронт из web/ рядом с существующими api/ui/app.
# Основной docker-compose.yml и Streamlit не меняются.
#
#   docker compose -f docker-compose.yml -f docker-compose.web.yml up --build
#   → React (данные из API): http://localhost:8081   Streamlit по-прежнему: http://localhost:8080
#
# Только фронт с демо-данными, без бэкенда (см. web/README.md):
#   docker build --build-arg VITE_DATA_MODE=mock -t ostrovok-web:mock web && docker run --rm -p 8082:8080 ostrovok-web:mock

services:
  web:
    build:
      context: ./web
      args:
        VITE_DATA_MODE: api
    image: ostrovok-web:api
    ports:
      - "8081:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

