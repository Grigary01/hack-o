# Дополнение к docker-compose.yml для сервера с доменом и HTTPS (o.devneli.ru).
# Подключается через COMPOSE_FILE в .env сервера, поэтому запуск — обычный `docker compose up -d --build`.
#   COMPOSE_FILE=docker-compose.yml:deploy/docker-compose.vps.yml
#
# Caddy принимает 80/443, сам получает и продлевает сертификат Let's Encrypt для $DOMAIN
# и проксирует на web:8080. Порт приложения 8080 на сервере слушает только localhost:
# Docker публикует порты в обход ufw, поэтому наружу открыты лишь 80/443.

services:
  web:
    ports: !override
      - "127.0.0.1:${WEB_PORT:-8080}:8080"

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Укажите DOMAIN в .env, например o.devneli.ru}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
