# Расплывчатые пожелания гостя, которые раскрываются в «любой из» нескольких признаков.
# Поиск не останавливается вопросом: проверяются все варианты, в ответе виден лучший,
# а над выдачей гостю предлагается уточнить (options). Признаки — только из registry.yaml.
#
# patterns — для офлайн-разбора (app/ml/rules_parser.py), по основам слов в нижнем регистре.
# hint — для LLM-парсера (app/ml/prompts.py): когда использовать понятие.
window_view:
  label: Вид из окна
  question: Какой вид важнее?
  default_weight: 0.6
  hint: 'Вид без уточнения, на что: «вид из окна», «с видом», «видовой номер», «красивый вид». Если назван конкретный вид (море, горы, закат) — это обычный признак, не понятие.'
  patterns: ['вид\w* из (окн|номер|комнат|балкон)\w*', 'с (красив\w* |хорош\w* |отличн\w* )?видом(?! на)', 'видов\w* (номер|комнат)\w*', 'красив\w* вид\w*(?! на)', 'хорош\w* вид\w*(?! на)']
  options:
    - {key: sea, label: На море, feature_key: sea_view_potential, desired: wide}
    - {key: mountains, label: На горы, feature_key: mountain_view_potential, desired: wide}
    - {key: sunset, label: Закат, feature_key: sunset_view_potential, desired: year_round}
