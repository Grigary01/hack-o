walking_distance_to_beach_m:
  label: Путь до пляжа
  description: Длина пути по walking graph OSM с оценочными отрезками привязки. Доступ входов требует проверки.
  type: number
  unit: m
  scope: hotel
  provider: pedestrian_distance
  query_hint: 'У моря, рядом с пляжем, первая линия, близко к морю, не хочется далеко ходить → soft near. Число с «пешком» → hard в метрах. По прямой — не этот признак.'
  ttl_days: 90
  default_weight: 0.8
  aliases: [пляж, море рядом, пешком до моря]
  scale: 1000
  # «Рядом с пляжем» — это ещё и путь без трасс и подъёмов.
  companions:
    - {feature_key: beach_route_busy_crossings, desired: near, weight_factor: 0.6}
    - {feature_key: beach_route_climb_m, desired: near, weight_factor: 0.4}
  query_patterns: ['пляж\w*', '\bмор(е|я|ю|ем)\b', 'перв\w* (берегов\w* )?лини\w*', 'набережн\w*', 'берег\w*']
  query_desired: near
quietness_proxy:
  label: Потенциал тишины снаружи
  description: Эвристика дорог, железной дороги и ночных заведений. Не дБ и не тишина в номере.
  type: category
  choices: [low, medium, high]
  unit: null
  scope: hotel
  provider: quietness
  query_hint: 'Тихо, тишина, спокойно, выспаться, без шума вокруг → high. Шумный, оживлённый, в гуще событий → low. Это шум снаружи, не шумоизоляция номера.'
  ttl_days: 90
  default_weight: 0.9
  aliases: [тихо, тишина, тихий]
  query_patterns: ['тих\w*', 'тишин\w*', 'спокойн\w*', 'высп\w*', 'безшумн\w*', 'бесшумн\w*']
  query_negative_patterns: ['шумн\w*', 'громк\w*', 'оживл[её]нн\w*', '\bшум(а|ом|у|е)?\b']
  query_desired: high
  ordinal: true
  choice_labels: {low: низкий, medium: средний, high: высокий}
  # В Адлере тишину определяет и аэропорт: OSM-proxy его не учитывает.
  companions:
    - {feature_key: aircraft_path_distance_m, desired: far, weight_factor: 0.8}
nightlife_distance_m:
  label: До отмеченного в OSM бара или клуба по прямой
  description: До ближайшего известного заведения; неполнота OSM не доказывает отсутствие баров.
  type: number
  unit: m
  scope: hotel
  provider: nightlife_distance
  query_hint: 'Бары, клубы, пабы, ночная жизнь. Хочет поближе → near; подальше, не рядом, не хочу рядом → far. Число — hard в метрах по прямой.'
  ttl_days: 60
  default_weight: 0.7
  aliases: [не рядом с барами, подальше от клубов]
  scale: 500
  query_patterns: ['\bбар(ы|ов|ам|ами|ах|а|е|у)?\b', 'клуб\w*', 'ночн\w* жизн\w*', 'тусов\w*', 'дискотек\w*', 'паб\w*']
  query_desired: near
sea_view:
  label: Вид на море из номера
  description: Утверждение отельера о конкретных номерах, независимо не проверено.
  type: boolean
  unit: null
  scope: room
  provider: hotelier
  query_hint: 'Видеть море из окна или номера, морской вид, панорама моря. Близость пляжа — другой признак.'
  ttl_days: 90
  default_weight: 0.6
  aliases: [вид на море, море из окна]
  question: В каких конкретно номерах есть или нет вида на море? Укажите номера и этаж, если известен.
  query_patterns: ['вид\w* на мор\w*', 'мор\w* из окн\w*', 'видн\w* мор\w*', 'окн\w* на мор\w*', 'панорам\w* мор\w*', 'морск\w* вид\w*', 'видовой']
  query_desired: true
  companions:
    - {feature_key: sea_view_potential, desired_if_true: wide}
  model_check: {potential: sea_view_potential, none_value: none, min_floor: sea_view_min_floor}
soundproofing:
  label: Шумоизоляция номера
  description: Утверждение отельера, не акустическое измерение.
  type: boolean
  unit: null
  scope: room
  provider: hotelier
  query_hint: 'Шумоизоляция, звукоизоляция, не слышно улицы или соседей в номере. Тишина района — другой признак.'
  ttl_days: 180
  default_weight: 0.7
  aliases: [шумоизоляция, звукоизоляция]
  question: В каких конкретно номерах есть или нет шумоизоляции? Укажите номера.
  query_patterns: ['шумоизол\w*', 'звукоизол\w*', 'шумоизоляц\w*']
  query_desired: true
sunset_view:
  label: Вид на закат из номера
  description: Утверждение отельера; модель рельефа и ориентация окон пока не рассчитываются.
  type: boolean
  unit: null
  scope: room
  provider: hotelier
  query_hint: 'Закат, заход солнца из окна, номера или балкона.'
  ttl_days: 90
  default_weight: 0.6
  aliases: [вид на закат, закат из окна]
  question: Из каких конкретно номеров виден закат? Для сложных условий по месяцам нужна ручная проверка.
  query_patterns: ['закат\w*', 'заход\w* солнц\w*']
  query_desired: true
  companions:
    - {feature_key: sunset_view_potential, desired_if_true: year_round}
  model_check: {potential: sunset_view_potential, none_value: none, min_floor: sunset_view_min_floor}
sea_view_potential:
  label: Вид на море из окон (расчёт)
  description: Видимость моря по рельефу Copernicus и высотам зданий OSM для точек фасада по этажам. Где именно окна, не проверено; деревья не учтены.
  type: category
  choices: [none, partial, wide]
  unit: null
  scope: hotel
  provider: viewshed
  ttl_days: 180
  default_weight: 0.6
  aliases: [вид на море, море из окна, панорама моря]
  ordinal: true
  choice_labels: {none: моря не видно, partial: море в просвете, wide: широкий вид}
sea_view_min_floor:
  label: Море видно с этажа (расчёт)
  description: Самый низкий этаж, с которого на каком-либо фасаде открыто ≥3% обзора окна на море. Этажность из OSM или допущение.
  type: number
  unit: floor
  scope: hotel
  provider: viewshed
  ttl_days: 180
  default_weight: 0.4
  aliases: [с какого этажа море]
  scale: 3
sunset_view_potential:
  label: Закат из окон (расчёт)
  description: Видно ли низкое солнце (ниже 3°) по месяцам с учётом горизонта по рельефу и домам. Сезонно — меньше 10 месяцев.
  type: category
  choices: [none, seasonal, year_round]
  unit: null
  scope: hotel
  provider: viewshed
  ttl_days: 180
  default_weight: 0.6
  aliases: [закат, вид на закат, закат из окна]
  ordinal: true
  choice_labels: {none: заката не видно, seasonal: по сезонам, year_round: круглый год}
sunset_view_min_floor:
  label: Закат виден с этажа (расчёт)
  description: Самый низкий этаж, с которого закат виден хотя бы в одном месяце.
  type: number
  unit: floor
  scope: hotel
  provider: viewshed
  ttl_days: 180
  default_weight: 0.4
  aliases: [с какого этажа закат]
  scale: 3
aircraft_noise_exposure:
  label: Воздействие авиашума (расчёт)
  description: По наклонному расстоянию до продолженных осей ВПП Сочи с глиссадой 3°. high < 800 м, medium < 2 км. Не дБ; реальные треки и загрузка полос не учтены.
  type: category
  choices: [low, medium, high]
  unit: null
  scope: hotel
  provider: aircraft_noise
  ttl_days: 365
  default_weight: 0.8
  aliases: [самолёты, авиашум, шум самолётов, аэропорт]
  ordinal: true
  choice_labels: {low: слабое, medium: заметное, high: сильное}
aircraft_path_distance_m:
  label: До траектории самолётов (расчёт)
  description: Кратчайшее наклонное расстояние от 3-го этажа до траектории захода/взлёта по продолжению оси ВПП.
  type: number
  unit: m
  scope: hotel
  provider: aircraft_noise
  query_hint: 'Самолёты, аэропорт, взлётная полоса, авиашум. Желание удалиться → far. Число до траектории самолётов — hard >= в метрах.'
  ttl_days: 365
  default_weight: 0.7
  aliases: [подальше от самолётов, далеко от аэропорта]
  scale: 1000
  query_patterns: ['самол[её]т\w*', 'авиашум\w*', 'аэропорт\w*', 'взл[её]т\w*', 'авиаци\w*']
  query_desired: far
beach_route_climb_m:
  label: Подъёмы по пути к пляжу (расчёт)
  description: Набор высоты туда или обратно (что больше) по пешему маршруту, рельеф Copernicus GLO-30. Погрешность 2–4 м.
  type: number
  unit: m
  scope: hotel
  provider: route_quality
  query_hint: 'Подъёмы, в гору, горка, лестницы, перепад высот, коляска, ровная дорога к пляжу → near (меньше подъёма). Число метров подъёма — hard <=.'
  ttl_days: 365
  default_weight: 0.5
  aliases: [без подъёмов, ровная дорога]
  scale: 10
  query_patterns: ['подъ[её]м\w*', 'в гору', 'в горку', 'горк\w*', 'перепад\w* высот\w*', 'лестниц\w*', 'ровн\w* дорог\w*', 'коляск\w*']
  query_desired: near
  query_negation_keeps: true
beach_route_busy_crossings:
  label: Переходы через трассы по пути к пляжу (расчёт)
  description: Сколько раз пеший маршрут пересекает trunk/primary/secondary в одном уровне; тип перехода по OSM.
  type: number
  unit: count
  scope: hotel
  provider: route_quality
  query_hint: 'Переходить трассу, дорогу или магистраль по пути к пляжу, светофоры → near (меньше переходов). Число переходов — hard <=, unit=count.'
  ttl_days: 180
  default_weight: 0.6
  aliases: [без перехода трассы]
  scale: 1
  query_patterns: ['переход\w* (через )?(трасс|дорог|улиц|магистрал)\w*', 'переходить (трасс|дорог|улиц)\w*', 'через трасс\w*', 'через дорог\w*', 'светофор\w*']
  query_desired: near
  query_negation_keeps: true
night_open_places_500m:
  label: Открыто ночью в 500 м (OSM)
  description: Аптеки, магазины, кафе, АЗС в 500 м по прямой, открытые в 01:00 все 7 дней по opening_hours OSM. Заведения без часов не учтены.
  type: number
  unit: count
  scope: hotel
  provider: night_amenities
  query_hint: 'Круглосуточные магазины, кафе, АЗС рядом (24/7). Хочет такие места → desired far: здесь far значит БОЛЬШЕ заведений. Обычные дневные кафе не поддерживаются.'
  ttl_days: 90
  default_weight: 0.5
  aliases: [круглосуточно рядом]
  scale: 3
  query_patterns: ['круглосуточн\w*', '\bночью\b', 'ночн\w* (магазин|кафе|ед[аыу]|перекус|доставк)\w*', '24/7', 'поздно вечером', 'перекусить ночью']
  query_desired: far
  query_negation_keeps: true
nearest_night_pharmacy_m:
  label: До аптеки, открытой ночью (OSM)
  description: Ближайшая аптека, открытая в 01:00 все дни, по прямой. Отсутствие в OSM не доказывает отсутствие аптеки.
  type: number
  unit: m
  scope: hotel
  provider: night_amenities
  query_hint: 'Ночная или круглосуточная аптека рядом → near. Число — hard <= в метрах. Обычная дневная аптека не поддерживается.'
  ttl_days: 90
  default_weight: 0.5
  aliases: [аптека рядом]
  scale: 500
  query_patterns: ['аптек\w*', 'лекарств\w*']
  query_desired: near
mountain_view_potential:
  label: Вид на горы из окон (расчёт)
  description: Видимость рельефа выше 300 м (отроги Кавказа, Ахун) в пределах 20 км по Copernicus и зданиям OSM. Главный хребет дальше 20 км не моделируется.
  type: category
  choices: [none, partial, wide]
  unit: null
  scope: hotel
  provider: viewshed
  query_hint: 'Вид на горы, горный пейзаж из окна → wide. Обязательно — hard = wide.'
  ttl_days: 180
  default_weight: 0.5
  aliases: [вид на горы]
  ordinal: true
  choice_labels: {none: гор не видно, partial: горы в просвете, wide: широкий вид}
  query_patterns: ['вид\w* на гор(ы|у|ах)\b', '\bгор(ы|ах|ам)\b', 'горн\w* (вид|пейзаж|панорам)\w*', 'панорам\w* гор\w*']
  query_desired: wide
mountain_view_min_floor:
  label: Горы видны с этажа (расчёт)
  description: Самый низкий этаж, с которого на каком-либо фасаде открыто ≥3% обзора окна на рельеф выше 300 м.
  type: number
  unit: floor
  scope: hotel
  provider: viewshed
  ttl_days: 180
  default_weight: 0.3
  aliases: [с какого этажа горы]
  scale: 3
quiet_side_potential:
  label: Тихая сторона здания (расчёт)
  description: Потенциал тишины снаружи на самой тихой стене здания — с экранированием своим и соседними домами. Те же веса и пороги, что у потенциала тишины; не дБ.
  type: category
  choices: [low, medium, high]
  unit: null
  scope: hotel
  provider: facade_noise
  query_hint: 'Окна во двор, тихая сторона здания, окна не на улицу или дорогу → high. Тишина района в целом — quietness_proxy.'
  ttl_days: 90
  default_weight: 0.6
  aliases: [окна во двор, тихая сторона]
  ordinal: true
  choice_labels: {low: шумно со всех сторон, medium: умеренно, high: есть тихая сторона}
  query_patterns: ['тих\w* сторон\w*', 'окн\w* (выходят |смотрят )?во двор', '\bво двор\w*', 'окн\w* не на (улиц|дорог)\w*']
  query_desired: high
view_obstruction_risk:
  label: Деревья и дома перед окнами (расчёт)
  description: Насколько вид на море, закат или горы зависит от высоты деревьев и соседних домов — по сценариям расчёта вида (деревья 0 / 0,6 / 1,0 от измеренной). Деревья вплотную к фасаду и листва по сезонам не учтены.
  type: category
  choices: [low, medium, high]
  unit: null
  scope: hotel
  provider: view_robustness
  query_hint: 'Без деревьев перед окном, чтобы деревья или дома не закрывали вид, открытый вид → low.'
  ttl_days: 180
  default_weight: 0.5
  aliases: [без деревьев, деревья не закрывают вид]
  ordinal: true
  choice_labels: {low: деревья и дома вид не закрывают, medium: вид частично зависит от деревьев и домов, high: деревья или дома могут закрыть вид}
  query_patterns: ['без деревь\w*', 'деревь\w* не (закрыва|загоражива|мешаю|перекрыва)\w*', 'не (закрыва|загоражива|перекрыва)\w* деревь\w*', 'деревь\w* перед окн\w*', 'без (застройки|домов) перед окн\w*', 'открыт\w* вид\w*']
  query_desired: low
  query_negation_keeps: true
blackout_curtains:
  label: Плотные шторы
  description: Утверждение отельера о плотных шторах в конкретном номере, независимо не проверено.
  type: boolean
  unit: null
  scope: room
  provider: hotelier
  ttl_days: 180
  default_weight: 0.5
  query_desired: true
  # «шторы blackout» целиком, чтобы слово «шторами» не уходило в «не учтено» (макет: «со шторами blackout»).
  query_patterns: ['штор\w* (blackout|бл[эе]каут\w*)', 'плотн\w* штор\w*', 'бл[эе]каут\w*', '\bblackout\b']
  # Латинское blackout — как пишут отельеры: «В номерах 301–305 есть шторы blackout».
  aliases: [плотные шторы, плотных штор, плотными шторами, шторы блэкаут, штор блэкаут, блэкаут, шторы blackout, штор blackout, blackout]
  question: В каких конкретно номерах есть или нет плотных штор? Укажите номера и этаж, если известен.
