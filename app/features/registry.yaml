walking_distance_to_beach_m:
  label: Путь до пляжа
  description: Длина пути по walking graph OSM с оценочными отрезками привязки. Доступ входов требует проверки.
  type: number
  unit: m
  scope: hotel
  provider: pedestrian_distance
  ttl_days: 90
  default_weight: 0.8
  aliases: [пляж, море рядом, пешком до моря]
  scale: 1000
quietness_proxy:
  label: Потенциал тишины снаружи
  description: Эвристика дорог, железной дороги и ночных заведений. Не дБ и не тишина в номере.
  type: category
  choices: [low, medium, high]
  unit: null
  scope: hotel
  provider: quietness
  ttl_days: 90
  default_weight: 0.9
  aliases: [тихо, тишина, тихий]
nightlife_distance_m:
  label: До отмеченного в OSM бара или клуба по прямой
  description: До ближайшего известного заведения; неполнота OSM не доказывает отсутствие баров.
  type: number
  unit: m
  scope: hotel
  provider: nightlife_distance
  ttl_days: 60
  default_weight: 0.7
  aliases: [не рядом с барами, подальше от клубов]
  scale: 500
sea_view:
  label: Вид на море из номера
  description: Утверждение отельера о конкретных номерах, независимо не проверено.
  type: boolean
  unit: null
  scope: room
  provider: hotelier
  ttl_days: 90
  default_weight: 0.6
  aliases: [вид на море, море из окна]
  question: В каких конкретно номерах есть или нет вида на море? Укажите номера и этаж, если известен.
soundproofing:
  label: Шумоизоляция номера
  description: Утверждение отельера, не акустическое измерение.
  type: boolean
  unit: null
  scope: room
  provider: hotelier
  ttl_days: 180
  default_weight: 0.7
  aliases: [шумоизоляция, звукоизоляция]
  question: В каких конкретно номерах есть или нет шумоизоляции? Укажите номера.
sunset_view:
  label: Вид на закат из номера
  description: Утверждение отельера; модель рельефа и ориентация окон пока не рассчитываются.
  type: boolean
  unit: null
  scope: room
  provider: hotelier
  ttl_days: 90
  default_weight: 0.6
  aliases: [вид на закат, закат из окна]
  question: Из каких конкретно номеров виден закат? Для сложных условий по месяцам нужна ручная проверка.
sea_view_potential:
  label: Вид на море из окон (расчёт)
  description: Видимость моря по рельефу Copernicus и высотам зданий OSM для точек фасада по этажам. Где именно окна, не проверено; деревья не учтены.
  type: category
  choices: [none, partial, wide]
  unit: null
  scope: hotel
  provider: viewshed
  ttl_days: 180
  default_weight: 0.6
  aliases: [вид на море, море из окна, панорама моря]
sea_view_min_floor:
  label: Море видно с этажа (расчёт)
  description: Самый низкий этаж, с которого на каком-либо фасаде открыто ≥3% обзора окна на море. Этажность из OSM или допущение.
  type: number
  unit: floor
  scope: hotel
  provider: viewshed
  ttl_days: 180
  default_weight: 0.4
  aliases: [с какого этажа море]
  scale: 3
sunset_view_potential:
  label: Закат из окон (расчёт)
  description: Видно ли низкое солнце (ниже 3°) по месяцам с учётом горизонта по рельефу и домам. Сезонно — меньше 10 месяцев.
  type: category
  choices: [none, seasonal, year_round]
  unit: null
  scope: hotel
  provider: viewshed
  ttl_days: 180
  default_weight: 0.6
  aliases: [закат, вид на закат, закат из окна]
sunset_view_min_floor:
  label: Закат виден с этажа (расчёт)
  description: Самый низкий этаж, с которого закат виден хотя бы в одном месяце.
  type: number
  unit: floor
  scope: hotel
  provider: viewshed
  ttl_days: 180
  default_weight: 0.4
  aliases: [с какого этажа закат]
  scale: 3
