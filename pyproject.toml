[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ostrovok-adler"
version = "0.1.0"
description = "Evidence-based hotel discovery for coastal Adler"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.32,<1", "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3", "httpx>=0.28,<1", "PyYAML>=6,<7",
  "networkx>=3.4,<4", "shapely>=2.1,<3", "pyproj>=3.7,<4",
  "python-dotenv>=1,<2", "streamlit>=1.41,<2", "folium>=0.19,<1",
]

[project.optional-dependencies]
geo = ["osmnx>=2.0,<3", "scikit-learn>=1.6,<2"]
test = ["pytest>=8.3,<10"]

[tool.setuptools.packages.find]
include = ["app*", "frontend*", "scripts*"]

[tool.setuptools.package-data]
"app.features" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
