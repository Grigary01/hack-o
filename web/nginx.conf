# React (SPA) + прокси на FastAPI (сервис backend из compose.yaml). Используется в web/Dockerfile.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 2m;

    # resolver + переменная: nginx стартует и без сервиса backend (mock-сборка, docker run).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_read_timeout 150s;
    }

    # Документация и liveness бэкенда — на том же адресе, что и интерфейс.
    location ~ ^/(docs|redoc|openapi\.json|health)$ {
        proxy_pass $backend;
        proxy_set_header Host $host;
    }

    # Собственная проверка контейнера web (не зависит от бэкенда).
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"web"}';
    }

    # Иллюстративные фото: меняются редко, имена без хеша — кэш на неделю.
    location /photos/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
