# Статика React (SPA) + прокси /api на FastAPI. Используется только в web/Dockerfile.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 2m;

    location /api/ {
        # resolver + переменная: nginx стартует и в mock-сборке, когда сервиса api нет.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 150s;
    }

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","service":"web"}';
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
