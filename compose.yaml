x-app: &app
  build: .
  init: true
  restart: unless-stopped

services:
  backend:
    <<: *app
    entrypoint: ["sh", "/app/docker/backend-entrypoint.sh"]
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: sqlite:////app/runtime/adler.db
      PARSER_MODE: ${PARSER_MODE:-fixture}
      REPLY_PARSER_MODE: ${REPLY_PARSER_MODE:-rules}
      DEMO_MODE: ${DEMO_MODE:-true}
      MODEL_NAME: ${MODEL_NAME:-gemma3:12b}
      OLLAMA_URL: ${DOCKER_OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_NUM_CTX: ${OLLAMA_NUM_CTX:-8192}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      PARSER_TIMEOUT_SECONDS: ${PARSER_TIMEOUT_SECONDS:-90}
      OPENAQ_API_KEY: ${OPENAQ_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - adler-data:/app/runtime
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)); assert r['status'] == 'ok'"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    <<: *app
    command:
      - python
      - -m
      - streamlit
      - run
      - frontend/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false
    environment:
      API_URL: http://backend:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8501}:8501"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  adler-data:
