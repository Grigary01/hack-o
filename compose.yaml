# Всё приложение одной командой:
#   docker compose up --build
#   React-фронт (основной):  http://localhost:8080        (/api, /docs → backend)
#   Streamlit (прежний UI):  http://localhost:8501
#   FastAPI напрямую:        http://localhost:8000/docs
# Порты и режим разбора переопределяются в .env (см. .env.example).

x-backend-image: &backend-image
  build: .
  image: ostrovok-adler:local
  init: true
  restart: unless-stopped

services:
  backend:
    <<: *backend-image
    # Миграции (с резервной копией SQLite) → идемпотентный seed демо-данных → uvicorn.
    entrypoint: ["sh", "/app/docker/backend-entrypoint.sh"]
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: sqlite:////app/runtime/adler.db
      # Модель и параметры генерации — в config/models.yaml; здесь только режим и адреса.
      PARSER_MODE: ${DOCKER_PARSER_MODE:-offline}
      REPLY_PARSER_MODE: ${REPLY_PARSER_MODE:-rules}
      DEMO_MODE: ${DEMO_MODE:-true}
      OLLAMA_URL: ${DOCKER_OLLAMA_URL:-http://host.docker.internal:11434}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAQ_API_KEY: ${OPENAQ_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - adler-data:/app/runtime
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)); assert r['status'] == 'ok'"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

  web:
    build:
      context: ./web
      args:
        VITE_DATA_MODE: api
    image: ostrovok-web:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6

  frontend:
    <<: *backend-image
    command:
      - python
      - -m
      - streamlit
      - run
      - frontend/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false
    environment:
      API_URL: http://backend:8000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8501}:8501"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  adler-data:
