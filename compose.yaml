# Всё приложение одной командой:
#   docker compose up --build
#   React-фронт (основной):  http://localhost:8080        (/api, /docs, /health → backend)
#   FastAPI напрямую:        http://localhost:8000/docs
# Порты и режимы переопределяются в .env (см. .env.example); модель — в config/models.yaml.

x-app: &app
  build: .
  image: ostrovok-adler:local
  init: true
  restart: unless-stopped

services:
  backend:
    <<: *app
    entrypoint: ["sh", "/app/docker/backend-entrypoint.sh"]
    command: ["python", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      DATABASE_URL: sqlite:////app/runtime/adler.db
      PARSER_MODE: ${PARSER_MODE:-}
      REPLY_PARSER_MODE: ${REPLY_PARSER_MODE:-}
      DEMO_MODE: ${DEMO_MODE:-true}
      OLLAMA_URL: ${DOCKER_OLLAMA_URL:-http://host.docker.internal:11434}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # Любой OpenAI-совместимый провайдер вместо Groq (например, Claude через прокси);
      # пусто — Groq и модель из config/models.yaml. Ключ — GROQ_API_KEY.
      CLOUD_LLM_BASE_URL: ${CLOUD_LLM_BASE_URL:-}
      CLOUD_LLM_MODEL: ${CLOUD_LLM_MODEL:-}
      HYBRID_LLM: ${HYBRID_LLM:-}
      OPENAQ_API_KEY: ${OPENAQ_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - adler-data:/app/runtime
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)); assert r['status'] == 'ok'"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ./web
      args:
        VITE_DATA_MODE: api
    image: ostrovok-web:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  adler-data:
