name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -c requirements.lock -e '.[test]'
      # Тесты не ходят во внешнюю сеть и не используют LLM.
      - run: python -m pytest -q
        env:
          PARSER_MODE: ''
          GROQ_API_KEY: ''
          CLOUD_LLM_BASE_URL: ''
          CLOUD_LLM_MODEL: ''
          HYBRID_LLM: ''

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Типы, линтер, тесты и production-сборка.
      - run: npm run check

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      # Ровно как у жюри: сборка и запуск одной командой, затем проверка /health на 8080.
      - run: docker compose up --build --detach --wait --wait-timeout 300
      - run: curl --fail --silent http://localhost:8080/health
      - run: curl --fail --silent --output /dev/null http://localhost:8080/
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
